<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Zalo QR Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;600;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blue: #0068ff;
      --blue-dark: #0051cc;
      --blue-light: #e8f0ff;
      --green: #00c851;
      --red: #ff3b30;
      --orange: #ff9500;
      --gray: #8e8e93;
      --bg: #f2f4f8;
      --card: #ffffff;
      --text: #1c1c1e;
      --sub: #6e6e73;
    }

    body {
      font-family: 'Be Vietnam Pro', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* Background decoration */
    body::before {
      content: '';
      position: fixed;
      top: -200px; left: -200px;
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(0,104,255,0.08) 0%, transparent 70%);
      pointer-events: none;
    }
    body::after {
      content: '';
      position: fixed;
      bottom: -200px; right: -200px;
      width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(0,200,81,0.06) 0%, transparent 70%);
      pointer-events: none;
    }

    .card {
      background: var(--card);
      border-radius: 24px;
      padding: 40px 36px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.10), 0 1px 3px rgba(0,0,0,0.06);
      position: relative;
      animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
    }

    .zalo-icon {
      width: 44px; height: 44px;
      background: var(--blue);
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }

    .zalo-icon svg { width: 26px; height: 26px; fill: white; }

    .header-text h1 {
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.2;
    }

    .header-text p {
      font-size: 13px;
      color: var(--sub);
      margin-top: 2px;
    }

    /* QR Box */
    .qr-box {
      background: var(--bg);
      border-radius: 16px;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      min-height: 280px;
      position: relative;
      overflow: hidden;
      border: 2px solid transparent;
      transition: border-color 0.3s;
    }

    .qr-box.scanned { border-color: var(--green); }
    .qr-box.expired  { border-color: var(--orange); }
    .qr-box.declined { border-color: var(--red); }

    #qr-img {
      width: 240px; height: 240px;
      border-radius: 8px;
      display: none;
      transition: opacity 0.3s;
    }

    /* Skeleton loader */
    .skeleton {
      width: 240px; height: 240px;
      border-radius: 8px;
      background: linear-gradient(90deg, #e8eaed 25%, #f5f5f5 50%, #e8eaed 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
    }

    @keyframes shimmer {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* Overlay trạng thái */
    .qr-overlay {
      position: absolute;
      inset: 0;
      background: rgba(255,255,255,0.94);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      border-radius: 14px;
      backdrop-filter: blur(4px);
    }

    .qr-overlay.show { display: flex; }

    .overlay-icon {
      font-size: 48px;
      animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popIn {
      from { transform: scale(0); opacity: 0; }
      to   { transform: scale(1); opacity: 1; }
    }

    .overlay-text {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      text-align: center;
    }

    .overlay-sub {
      font-size: 13px;
      color: var(--sub);
      text-align: center;
    }

    /* User info khi quét xong */
    .user-info {
      display: none;
      align-items: center;
      gap: 12px;
      background: #f0fff6;
      border: 1px solid #c3f0d8;
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 16px;
      animation: slideUp 0.3s ease;
    }

    .user-info.show { display: flex; }

    .user-avatar {
      width: 44px; height: 44px;
      border-radius: 50%;
      object-fit: cover;
      background: #ddd;
      flex-shrink: 0;
    }

    .user-name { font-size: 14px; font-weight: 600; color: var(--text); }
    .user-label { font-size: 12px; color: var(--green); }

    /* Status bar */
    .status-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border-radius: 10px;
      background: var(--blue-light);
      margin-bottom: 16px;
      min-height: 42px;
      transition: all 0.3s;
    }

    .status-bar.success { background: #e6fff0; }
    .status-bar.error   { background: #fff0f0; }
    .status-bar.warning { background: #fff8e6; }

    .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--blue);
      flex-shrink: 0;
      transition: background 0.3s;
    }

    .status-dot.pulse {
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.5; transform: scale(0.8); }
    }

    .status-dot.green   { background: var(--green); }
    .status-dot.red     { background: var(--red); }
    .status-dot.orange  { background: var(--orange); }

    .status-text {
      font-size: 13px;
      color: var(--text);
      font-weight: 500;
    }

    /* Buttons */
    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-primary {
      background: var(--blue);
      color: white;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--blue-dark);
      transform: translateY(-1px);
      box-shadow: 0 4px 16px rgba(0,104,255,0.35);
    }

    .btn-primary:active:not(:disabled) {
      transform: translateY(0);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Proxy input */
    .proxy-section {
      margin-bottom: 16px;
    }

    .proxy-toggle {
      font-size: 12px;
      color: var(--blue);
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      margin-bottom: 8px;
    }

    .proxy-input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #e0e0e5;
      border-radius: 10px;
      font-family: inherit;
      font-size: 13px;
      color: var(--text);
      background: var(--bg);
      display: none;
      outline: none;
      transition: border-color 0.2s;
    }

    .proxy-input:focus { border-color: var(--blue); }
    .proxy-input.show  { display: block; }

    /* Steps */
    .steps {
      margin-top: 20px;
      display: flex;
      gap: 8px;
    }

    .step {
      flex: 1;
      text-align: center;
      font-size: 11px;
      color: var(--sub);
      position: relative;
    }

    .step-num {
      width: 24px; height: 24px;
      border-radius: 50%;
      background: #e8eaed;
      color: var(--sub);
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 700;
      margin: 0 auto 4px;
      transition: all 0.3s;
    }

    .step.active .step-num { background: var(--blue); color: white; }
    .step.done .step-num   { background: var(--green); color: white; }

    .step:not(:last-child)::after {
      content: '';
      position: absolute;
      top: 12px; right: -4px;
      width: 8px; height: 1px;
      background: #e0e0e5;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="zalo-icon">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2C6.477 2 2 6.145 2 11.243c0 2.908 1.444 5.507 3.712 7.205-.163.6-.526 1.928-.603 2.228-.093.372.137.368.288.268.118-.078 1.876-1.27 2.633-1.782.601.133 1.224.204 1.863.204.091 0 .182-.002.272-.005C10.594 20.69 11.294 21 12 21c5.523 0 10-4.03 10-9S17.523 2 12 2zm-4.5 13.5l3-4.5H7l3.5-5H9l3-4.5 4.5 6.5h-3.5l3 4.5h-4.5l-4 3z"/>
        </svg>
      </div>
      <div class="header-text">
        <h1>Đăng nhập Zalo</h1>
        <p>Quét mã QR bằng ứng dụng Zalo</p>
      </div>
    </div>

    <!-- User info (hiện sau khi quét) -->
    <div class="user-info" id="user-info">
      <img class="user-avatar" id="user-avatar" src="" alt="" onerror="this.style.display='none'"/>
      <div>
        <div class="user-name" id="user-name">-</div>
        <div class="user-label">✓ Đã xác nhận tài khoản</div>
      </div>
    </div>

    <!-- QR Code Box -->
    <div class="qr-box" id="qr-box">
      <div class="skeleton" id="skeleton"></div>
      <img id="qr-img" src="" alt="QR Code"/>
      <div class="qr-overlay" id="qr-overlay">
        <div class="overlay-icon" id="overlay-icon"></div>
        <div class="overlay-text" id="overlay-text"></div>
        <div class="overlay-sub" id="overlay-sub"></div>
      </div>
    </div>

    <!-- Status -->
    <div class="status-bar" id="status-bar">
      <div class="status-dot pulse" id="status-dot"></div>
      <div class="status-text" id="status-text">Đang khởi tạo...</div>
    </div>

    <!-- Proxy -->
    <div class="proxy-section">
      <a class="proxy-toggle" onclick="toggleProxy()">⚙ Cài đặt proxy (tuỳ chọn)</a>
      <input class="proxy-input" id="proxy-input" type="text"
             placeholder="https://user:pass@host:port"/>
    </div>

    <!-- Button -->
    <button class="btn btn-primary" id="btn" onclick="startLogin()">
      🔄 Tạo mã QR mới
    </button>

    <!-- Steps -->
    <div class="steps">
      <div class="step" id="step-1">
        <div class="step-num">1</div>
        Tạo QR
      </div>
      <div class="step" id="step-2">
        <div class="step-num">2</div>
        Quét mã
      </div>
      <div class="step" id="step-3">
        <div class="step-num">3</div>
        Xác nhận
      </div>
      <div class="step" id="step-4">
        <div class="step-num">4</div>
        Lưu credentials
      </div>
    </div>
  </div>

  <script>
    let pollingInterval = null;
    let proxyVisible = false;

    function toggleProxy() {
      proxyVisible = !proxyVisible;
      document.getElementById('proxy-input').classList.toggle('show', proxyVisible);
    }

    function setStatus(text, type = 'default', dotClass = 'pulse') {
      const bar = document.getElementById('status-bar');
      const dot = document.getElementById('status-dot');
      const txt = document.getElementById('status-text');

      bar.className = 'status-bar ' + (type !== 'default' ? type : '');
      dot.className = 'status-dot ' + dotClass;
      txt.textContent = text;
    }

    function setStep(active) {
      for (let i = 1; i <= 4; i++) {
        const el = document.getElementById(`step-${i}`);
        el.className = 'step' + (i < active ? ' done' : (i === active ? ' active' : ''));
      }
    }

    function showOverlay(icon, text, sub = '') {
      document.getElementById('overlay-icon').textContent = icon;
      document.getElementById('overlay-text').textContent = text;
      document.getElementById('overlay-sub').textContent = sub;
      document.getElementById('qr-overlay').classList.add('show');
    }

    function hideOverlay() {
      document.getElementById('qr-overlay').classList.remove('show');
    }

    async function startLogin() {
      clearInterval(pollingInterval);
      document.getElementById('btn').disabled = true;
      document.getElementById('user-info').classList.remove('show');
      document.getElementById('qr-img').style.display = 'none';
      document.getElementById('skeleton').style.display = 'block';
      document.getElementById('qr-box').className = 'qr-box';
      hideOverlay();
      setStep(1);
      setStatus('Đang tạo mã QR...', 'default', 'pulse');

      const proxy = document.getElementById('proxy-input').value.trim();

      try {
        const res = await fetch('https://ca.futurehomes.vn/zalo/login/qr', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ proxy }),
        });
        const data = await res.json();
        if (!data.success) throw new Error(data.error);

        // Hiển thị QR
        const img = document.getElementById('qr-img');
        img.src = `data:image/png;base64,${data.qr}`;
        img.style.display = 'block';
        document.getElementById('skeleton').style.display = 'none';

        setStep(2);
        setStatus('Mở Zalo → Quét mã QR', 'default', 'pulse');

        // Polling
        pollingInterval = setInterval(() => pollStatus(data.sessionId), 2000);
      } catch (err) {
        document.getElementById('skeleton').style.display = 'none';
        showOverlay('❌', 'Lỗi tạo QR', err.message);
        setStatus('Lỗi: ' + err.message, 'error', 'red');
        document.getElementById('btn').disabled = false;
      }
    }

    async function pollStatus(sessionId) {
      try {
        const res = await fetch(`https://ca.futurehomes.vn/zalo/login/status/${sessionId}`);
        if (res.status === 404) {
          clearInterval(pollingInterval);
          return;
        }
        const data = await res.json();

        switch (data.status) {
          case 'waiting_scan':
            setStatus('Đang chờ quét mã QR...', 'default', 'pulse');
            break;

          case 'scanned':
            setStep(3);
            setStatus('Đã quét! Nhấn xác nhận trên điện thoại...', 'default', 'green pulse');
            document.getElementById('qr-box').classList.add('scanned');
            if (data.userInfo) {
              document.getElementById('user-name').textContent = data.userInfo.name || 'Người dùng Zalo';
              const av = document.getElementById('user-avatar');
              if (data.userInfo.avatar) av.src = data.userInfo.avatar;
              document.getElementById('user-info').classList.add('show');
            }
            break;

          case 'expired':
            clearInterval(pollingInterval);
            document.getElementById('qr-box').classList.add('expired');
            showOverlay('⏰', 'Mã QR đã hết hạn', 'Nhấn nút bên dưới để tạo mã mới');
            setStatus('Mã QR hết hạn', 'warning', 'orange');
            document.getElementById('btn').disabled = false;
            break;

          case 'declined':
            clearInterval(pollingInterval);
            document.getElementById('qr-box').classList.add('declined');
            showOverlay('🚫', 'Đăng nhập bị từ chối', 'Người dùng đã từ chối xác nhận');
            setStatus('Đăng nhập bị từ chối', 'error', 'red');
            document.getElementById('btn').disabled = false;
            break;

          case 'success':
            clearInterval(pollingInterval);
            setStep(4);
            showOverlay('✅', 'Đăng nhập thành công!', 'Credentials đã được lưu vào zalo-credentials.json');
            setStatus('Đăng nhập thành công! Credentials đã lưu.', 'success', 'green');
            document.getElementById('btn').disabled = false;
            document.getElementById('btn').textContent = '🔄 Đăng nhập tài khoản khác';
            break;
        }
      } catch (err) {
        console.error('Polling error:', err);
      }
    }

    // Tự động khởi động
    startLogin();
  </script>
</body>
</html>
